<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login Page</title>
    <style>
        /* Modern Reset and Google Font Initialization */
        @import url('https://googleapis.com');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
        }

        /* Centered login card styling */
        .login-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 400px;
        }

        .login-container h2 {
            margin-bottom: 24px;
            color: #1f2937;
            font-size: 28px;
            font-weight: 600;
            text-align: center;
        }

        /* Form element layout styling */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #4b5563;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            border-color: #4f46e5;
        }

        /* Styled error messages container */
        .error-message {
            color: #ef4444;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .options-row a {
            color: #4f46e5;
            text-decoration: none;
            transition: color 0.2s;
        }

        .options-row a:hover {
            text-decoration: underline;
        }

        /* Primary action button styling */
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .submit-btn:hover {
            background-color: #4338ca;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #6b7280;
        }

        .signup-link a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 500;
        }
        
        .signup-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Welcome Back</h2>
        
        <form id="loginForm">
            <!-- Email Input Field -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
                <div class="error-message" id="emailError">Please enter a valid email address.</div>
            </div>

            <!-- Password Input Field -->
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
                <div class="error-message" id="passwordError">Password must be at least 6 characters long.</div>
            </div>

            <!-- Checkbox and Forgot Password Link -->
            <div class="options-row">
                <label>
                    <input type="checkbox"> Remember me
                </label>
                <a href="#">Forgot Password?</a>
            </div>

            <!-- Action Button -->
            <button type="submit" class="submit-btn">Log In</button>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="#">Sign up</a>
        </div>
    </div>

    <script>
        // DOM Elements selection
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');

        // Form submission intercepted for simulated frontend routing
        loginForm.addEventListener('submit', function(event) {
            // Prevent the browser from automatically refreshing the page
            event.preventDefault(); 
            
            let isValid = true;

            // Reset previous visibility states
            emailError.style.display = 'none';
            passwordError.style.display = 'none';

            // Custom JavaScript Validation Engine
            if (!emailInput.value.includes('@') || emailInput.value.trim() === '') {
                emailError.style.display = 'block';
                isValid = false;
            }

            if (passwordInput.value.length < 6) {
                passwordError.style.display = 'block';
                isValid = false;
            }

            // Simulated Successful Execution Routing
            if (isValid) {
                alert(`Login successfully simulated!\nEmail: ${emailInput.value}`);
                // Clear input values safely
                emailInput.value = '';
                passwordInput.value = '';
            }
        });
    </script>

</body>
</html>
